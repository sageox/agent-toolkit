# The one artifact this repository is required to ship. Everything else — the chart, the
# examples, the CLI — is optional; the runtime image is not, because correctness lives in
# the image and every deployment target is a thin adapter around it. Nothing outside this
# repository can depend on the toolkit until a tagged image exists at
# `ghcr.io/sageox/agent-base`.
#
# WHY THE IMAGE IS NOT NAMED AFTER THE REPO. This repository has been renamed once already,
# which is the argument rather than a hole in it: it led with `buzz` when this image was
# named, and `buzz` is one chat surface among several the runtime carries — Slack and
# console adapters ship in this same image. A repository can be renamed on a Tuesday, and
# this one was. A published image name cannot: consumers pin it, and every digest ever
# published stays reachable under it. This image was the first artifact that argument was
# applied to; it now governs
# every identifier here, and lives in `docs/naming.md` rather than in this comment — read
# it there before naming the next one.
#
# ANONYMOUS PULL IS THE POINT, NOT A DETAIL. GHCR is where the image lives specifically
# because it serves public artifacts without a token, so a cold quickstart never meets an
# authentication wall. A GHCR package is created *private* on its first push and has to be
# flipped once, by hand, at
# https://github.com/orgs/sageox/packages/container/agent-base/settings →
# "Change visibility" → Public. The verification step below fails the release until that
# has happened, which is the only thing that keeps the property true a year from now.
#
# THE DIGEST IS THE CONTRACT, NOT THE TAG. The deployment contract pins `imageRef` by
# digest, so each release records its manifest-list digest in its GitHub Release, beside a
# one-line summary of each of that version's CHANGELOG.md entries and the pull-request list
# GitHub generates on its own. The workflow writes the digest because nobody — not the
# tagger, not the reviewer — knows it before the build runs; it writes it to the release
# rather than onto `main` because that is not a branch write, and because the registry
# already answers `:VERSION` authoritatively.
name: Release

on:
  push:
    tags:
      - "v*"

# Serialize releases, and never cancel one mid-publish: an interrupted run can leave the
# image pushed and its digest recorded nowhere.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release that records the published digest
  packages: write # push the image to GHCR

env:
  IMAGE: ghcr.io/sageox/agent-base
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Full history, because the steps below decide this tag's fate by ancestry: whether
      # its commit is on `main`, and which released tags are merged into it. The default
      # single-commit fetch of a tag has no ancestors to answer either question with.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Two things have to be true before anything is built, and a tag alone proves
      # neither: that it names a release, and that it names one from `main`.
      - name: Require a release tag on main
        id: version
        run: |
          set -euo pipefail

          # `vMAJOR.MINOR.PATCH`, optionally with a semver `-PRERELEASE` suffix
          # (`v0.1.0-rc.1`). A tag this cannot describe — a stray `v`-prefixed name — stops
          # here rather than publishing a package version nobody chose.
          #
          # A prerelease publishes one thing: its own immutable `:VERSION`. It never takes
          # `:latest`, `:MAJOR.MINOR`, or `:MAJOR`. That is enforced by the alias
          # arithmetic below rather than by a branch here — see the `released` list it is
          # matched against.
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::${GITHUB_REF_NAME} is not a vMAJOR.MINOR.PATCH[-PRERELEASE] tag."
            exit 1
          fi

          # Both refs the rest of this job reasons about: `main`, to prove the tag is on it,
          # and every release tag, to decide which floating aliases this version may move.
          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/*:refs/tags/*"

          # A tag can be pushed at any commit, including one that was never merged. Without
          # this, the official image is built from code nobody reviewed and published under
          # release notes drawn from main's CHANGELOG — describing an image main's own
          # source never produced.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main."
            echo "::error::Releases are cut from main: merge first, then tag the merge."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve the image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          major="${VERSION%%.*}"
          rest="${VERSION#*.}"
          minor="${rest%%.*}"

          # Every release this repository has cut, oldest first. Restricted to tags merged
          # into main for the same reason the step above refuses unmerged ones: a tag that
          # this workflow would refuse to publish never produced an image, so counting it
          # as a release would let it suppress an alias on behalf of a digest that does not
          # exist — a stray `v2.0.0` on a branch would quietly cost a real `1.9.0` its
          # `:latest`. Publication and alias arithmetic have to agree on what a release is.
          #
          # The `$` anchor is also what keeps a prerelease off every floating alias: it
          # admits bare `X.Y.Z` only, so `v0.1.0-rc.1` is absent from this list, and the
          # comparisons below — each an equality against a member of it — cannot hold for a
          # version that is not in it. An rc therefore falls through to its own `:VERSION`
          # and nothing else. Widen this pattern to admit a prerelease suffix and `:latest`
          # begins pointing at release candidates.
          released=$(git tag --list 'v*' --merged refs/remotes/origin/main \
            | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' \
            | sort -V)

          # A floating alias may only move forward. A 1.3.9 backfilled after 1.4.0 still
          # earns its own immutable tag, but must not drag `:1.3`, `:1`, or `:latest` back
          # onto older code — everyone tracking one of those would silently downgrade, and
          # nothing about the pull would look unusual.
          #
          # Newer is decided by version order over the repo's tags, not by what the registry
          # currently holds. So a release whose own run failed before it published keeps its
          # aliases until that run is fixed: `:latest` waits for the newest release rather
          # than falling back to an older one. That withholding is the one outcome here a
          # reader cannot infer from the tag list, so it is stated rather than left as an
          # absence — the fix is to re-run the newer release, or to delete its tag if it was
          # abandoned.
          newest() { # newest <alias> <version regex>
            holder=$(printf '%s\n' "$released" | grep -E "^$2" | tail -n 1)
            [ "$holder" = "$VERSION" ] && return 0
            # Phrased as who holds it rather than "a newer release holds it", because a
            # prerelease reaches here with no holder at all: it is absent from `released`,
            # so nothing it is compared against can ever equal it.
            echo "Not publishing :${1} — held by ${holder:-no full release}, not ${VERSION}."
            return 1
          }

          tags="${IMAGE}:${VERSION}"
          if newest "${major}.${minor}" "${major}\.${minor}\."; then
            tags="${tags},${IMAGE}:${major}.${minor}"
          fi
          # The floating major tag is the coarse consumption ref (`:1`). Before 1.0.0 a
          # minor bump is a breaking change, so `:0` would promise a stability that does
          # not exist, and is deliberately not published.
          if [ "$major" != 0 ] && newest "${major}" "${major}\."; then
            tags="${tags},${IMAGE}:${major}"
          fi
          # `latest` is for evaluating the image in one line; production pins the digest.
          if newest latest ""; then
            tags="${tags},${IMAGE}:latest"
          fi

          echo "Publishing: ${tags}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

          # The release this one follows, for the pull-request list GitHub generates below.
          # Named rather than left to GitHub to infer, because it infers by tag date: a
          # 1.3.9 backfilled after 1.4.0 would list the pull requests between those two
          # instead of since 1.3.8, and a re-run would then replace a body the first run
          # published with a different one. Read from the same `released` list the alias
          # arithmetic uses, so both agree on what precedes what. A prerelease matches no
          # entry and falls out with the newest full release, which is the one it follows.
          # Empty for the first release ever, and then the field is omitted and GitHub
          # generates from the first commit.
          previous=$(printf '%s\n' "$released" \
            | awk -v v="$VERSION" '$0 == v { exit } { last = $0 } END { print last }')
          echo "Comparing against: ${previous:-no earlier release}"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      # Checked before the build, not after: an hour of multi-arch build that ends with
      # nowhere to record its digest is an expensive way to learn the release notes are
      # missing.
      - name: Require a CHANGELOG entry for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' heading. Move the"
            echo "::error::[Unreleased] entries under one, merge that, and re-tag."
            exit 1
          fi

      # A released tag is immutable, so a re-run must not rebuild it. Asked of the registry
      # anonymously, before the login below, because what must not move is what `:VERSION`
      # resolves to for a consumer.
      #
      # Fail closed: only a 404 — the registry stating the tag is absent — permits a build.
      # Any other outcome leaves it unknown, and building on unknown repoints the tag, since
      # the build's tag list still contains `:VERSION`.
      - name: Reuse a digest already published under this tag
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          repo="${IMAGE#ghcr.io/}"
          headers="$(mktemp)"

          if ! token=$(curl -fsS --retry 3 --retry-connrefused --max-time 30 \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -er .token); then
            echo "::error::could not mint an anonymous GHCR pull token, so whether"
            echo "::error::${IMAGE}:${VERSION} is already published is unknown. Refusing to"
            echo "::error::build: publishing now would repoint the tag if it exists. Re-run."
            exit 1
          fi

          if ! status=$(curl -sS --retry 3 --retry-connrefused --max-time 30 \
            -I -o "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${VERSION}"); then
            echo "::error::could not reach GHCR to check whether ${IMAGE}:${VERSION} is"
            echo "::error::already published. Refusing to build. Re-run."
            exit 1
          fi

          case "$status" in
            404)
              echo "::notice::${IMAGE}:${VERSION} is not published yet; building it."
              ;;
            200)
              digest=$(tr -d '\r' < "$headers" \
                | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
              if [ -z "${digest:-}" ]; then
                echo "::error::GHCR answered 200 for ${IMAGE}:${VERSION} but sent no"
                echo "::error::Docker-Content-Digest header, so the published digest is"
                echo "::error::unknown. Refusing to build."
                exit 1
              fi
              echo "::notice::${IMAGE}:${VERSION} already resolves to ${digest} — reusing it"
              echo "::notice::rather than rebuilding. Cut a new version to publish new code."
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::GHCR answered ${status} for ${IMAGE}:${VERSION}. Only 404 means"
              echo "::error::'not published'; anything else leaves that unknown, and building"
              echo "::error::on unknown can repoint a released tag. Refusing to build."
              exit 1
              ;;
          esac

      # Emulated arm64 rather than a native runner and a manifest merge: one job yields the
      # one manifest-list digest this release has to record, instead of two per-arch
      # digests handed between jobs to be reassembled into it. `ci.yml` runs the same
      # emulated build on every pull request, so a tag is never the first time it happens.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        if: steps.published.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # `image.source` is also what links the package to this repository, which is
          # what makes the package page show the README and the release history.
          labels: |
            org.opencontainers.image.title=agent-base
            org.opencontainers.image.description=Buzz Agent Toolkit runtime — gateway, chat adapters, and ACP brain bridge
            org.opencontainers.image.source=https://github.com/sageox/agent-toolkit
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      # One digest downstream, whether this run built it or found it already published.
      - name: Settle the digest this release publishes
        id: image
        env:
          REUSED: ${{ steps.published.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${REUSED:-$BUILT}"
          if [ -z "$digest" ]; then
            echo "::error::no digest: nothing was published and nothing was found."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # The property GHCR was chosen for, checked from outside the credential that pushed
      # it. A run that only ever inspects the image while still logged in cannot tell a
      # public package from a private one. Re-verified on a reused digest too: visibility
      # can be revoked after a publish.
      - name: Verify the anonymous, multi-arch pull
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io

          if ! index=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" 2>&1); then
            echo "::error::${IMAGE}@${DIGEST} is not pullable without credentials."
            echo "::error::Set the package to Public at"
            echo "::error::https://github.com/orgs/sageox/packages/container/agent-base/settings"
            printf '%s\n' "$index"
            exit 1
          fi

          # A published index missing a platform is worse than no release: a consumer on
          # that architecture gets a "no matching manifest" it cannot distinguish from a
          # bad tag.
          for platform in ${PLATFORMS//,/ }; do
            if ! printf '%s' "$index" | jq -e --arg os "${platform%/*}" --arg arch "${platform#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch)' >/dev/null; then
              echo "::error::the published index has no ${platform} manifest."
              exit 1
            fi
          done

      # The release, not `main`: a digest is derived, and the registry already answers
      # `:VERSION` authoritatively, so a tracked copy is a second source that drifts — it
      # did, on the first release. `CHANGELOG.md` keeps what humans write and is summarized
      # here. Creating a release is not a branch write, so no ruleset applies.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.tags.outputs.previous }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail

          # The lead sentence of each entry in this version's CHANGELOG section, under its
          # own heading. The section itself is the reasoning — 0.2.0's ran to 200 lines —
          # which pushed the digest and the pull-request list below the fold; it stays in
          # CHANGELOG.md, linked under the summary. An entry is joined across its wrapped
          # lines and stripped of `**` before the first sentence is cut, so one that opens
          # with a bold lead sentence reads here the same as one that does not.
          summary=$(awk -v heading="## [${VERSION}]" '
            function flush(  lead) {
              if (bullet == "") return
              gsub(/\*\*/, "", bullet)
              if (match(bullet, /[.!?] /))
                lead = substr(bullet, 1, RSTART)
              else
                lead = bullet
              print "- " lead
              bullet = ""
            }
            index($0, heading) == 1 { inside = 1; next }
            !inside { next }
            /^## / { flush(); exit }
            /^### / { flush(); sub(/^### /, "## "); if (seen++) print ""; print; print ""; next }
            /^- / { flush(); bullet = substr($0, 3); next }
            /^ / && bullet != "" { sub(/^ +/, ""); bullet = bullet " " $0; next }
            /^$/ { flush() }
            END { flush() }
          ' CHANGELOG.md)

          # What GitHub generates for a release on its own: every merged pull request with
          # its author, and the compare link against the release resolved above. Asked for
          # through the API rather than `gh release create --generate-notes`, which `gh
          # release edit` has no counterpart for — a re-run has to converge on the body the
          # first run published, and this is the one spelling both paths can share.
          generated=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=v${VERSION}" ${PREVIOUS:+-f "previous_tag_name=v${PREVIOUS}"} \
            --jq .body)

          body=$(printf '%s\n\nEach entry in full: [CHANGELOG.md](https://github.com/%s/blob/v%s/CHANGELOG.md).\n\n## Runtime image\n\n```\n%s@%s\n```\n\nPullable anonymously, `%s`. Pin the digest in production: the `%s` tag is immutable and is never republished.\n\n%s\n' \
            "$summary" "$GITHUB_REPOSITORY" "$VERSION" "$IMAGE" "$DIGEST" "$PLATFORMS" "$VERSION" "$generated")

          # GitHub hands its own "Latest release" badge to the newest release not marked
          # prerelease — a second `latest`, which the image tags above do not govern. An rc
          # has to decline it here too, or the repository front page advertises a release
          # candidate the registry deliberately refused `:latest`.
          #
          # Set both ways, so a re-run converges rather than only ever adding the mark.
          # `--latest` is deliberately not asserted alongside it: gh picks that badge by
          # date and version, and forcing it here would hand it to whichever tag ran last
          # — including a re-run of an old one — dragging it backward in exactly the case
          # the alias arithmetic above exists to prevent. A dash can only be the
          # prerelease separator; the version gate admits it nowhere else.
          case "$VERSION" in
            *-*) prerelease=--prerelease=true ;;
            *) prerelease=--prerelease=false ;;
          esac

          # Idempotent: a re-run must converge on what it published, not fail on it.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes "$body" "$prerelease"
            echo "::notice::updated the existing v${VERSION} release."
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --notes "$body" "$prerelease"
            echo "::notice::published the v${VERSION} release."
          fi
