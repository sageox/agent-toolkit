name: Bug report
description: Something isn't working the way it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please don't paste real
        customer data, messages, secrets, private keys, or tokens into this
        form — use anonymized or synthetic examples instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Reproduction steps
      description: The minimal steps to reproduce, ideally with a fresh agent.
      placeholder: |
        1. Run `./bin/sageox-agent ...`
        2. Configure ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Revision
      description: The release or commit SHA you are running.
    validations:
      required: true

  - type: input
    id: node-os
    attributes:
      label: Node version and OS
      placeholder: e.g. Node 22.12.0, macOS 15.1

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste sanitized CLI output or stack traces. This is rendered as a code block.
      render: shell
