{{/*
One class per source that declares a provider, so an agent that splits its credentials into
`secrets` and `jobSecrets` gets a class for each. Both are this agent's, and `validate.yaml`
holds each name to the same rule: an object this chart creates belongs to one agent.

The job class is component `<agent>-jobs`, not `<agent>`, because only scheduled job Pods
mount it. Something that reads the labels to decide what a missing key breaks — a deploy
preflight choosing between blocking the agent and warning about its jobs — can only make
that call if the two classes do not carry the same component.
*/}}
{{- range $name, $agent := .Values.agents }}
{{- range $field := list "secrets" "jobSecrets" }}
{{/* `get` answers "" for a key the agent never set, so the kind is the test, not truth. */}}
{{- $source := get $agent $field }}
{{- if kindIs "map" $source }}
{{- if $source.csi.provider }}
{{- $context := dict "root" $ "name" $name "agent" $agent -}}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $source.csi.secretProviderClass }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ ternary (printf "%s-jobs" $name) $name (eq $field "jobSecrets") | quote }}
spec:
  provider: {{ $source.csi.provider | quote }}
  parameters:
    {{- toYaml $source.csi.parameters | nindent 4 }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
