{{- if not .Values.agents -}}
{{- fail "agents must contain at least one agent bundle" -}}
{{- end -}}
{{/*
Rules for a direction `policyTypes` does not name. Kubernetes ignores them — a policy
restricts only the directions it lists — so what the consumer wrote applies nowhere and the
object still applies cleanly. Refused here rather than left to the schema, which can say
each list is well formed but not that the pair disagrees.
*/}}
{{- $networkPolicy := .Values.networkPolicy | default dict -}}
{{- range $direction := list "Ingress" "Egress" -}}
{{- if and (get $networkPolicy (lower $direction)) (not (has $direction $networkPolicy.policyTypes)) -}}
{{- fail (printf "networkPolicy.%s has rules but networkPolicy.policyTypes does not name %s: a policy restricts only the directions it lists, so these would render and never apply" (lower $direction) $direction) -}}
{{- end -}}
{{- end -}}
{{- range $name, $agent := .Values.agents -}}
{{/*
A bundle that names neither a volume nor a stager has no source at all: nothing populates
`/config`, `cp -LR /config/.` fails the init container, and on the CronJob path that is a
run lost under `backoffLimit: 0`. Refused here rather than left to the schema, which can say
the shape is legal but not that the pair is empty.
*/}}
{{/*
A `persistence.jobHome.jobs` slug that names no scheduled local command job mounts the home
nowhere, and reads as though a lane kept its state when every run starts empty. A worker's
Pod is the dispatcher's, and a prompt job runs in the gateway, so neither can mount it.
*/}}
{{- with ($agent.persistence).jobHome -}}
{{- range $slug := .jobs -}}
{{- $found := false -}}
{{- range $job := $agent.jobs -}}
{{- if and (eq $job.slug $slug) (not $job.worker) (not (hasKey $job "prompt")) $job.trigger.schedules -}}
{{- $found = true -}}
{{- end -}}
{{- end -}}
{{- if not $found -}}
{{- fail (printf "%s: persistence.jobHome.jobs names %s, which is not a scheduled local command job of this agent, so nothing would mount the home" $name $slug) -}}
{{- end -}}
{{- end -}}
{{/*
Every `paths` entry is input that earlier runs could write. One that is, holds or sits inside
a location a tool reads as config or instructions would let a body steered by untrusted text
plant those for every later run of every named lane. Two entries where one holds the other
would mount the same files twice.
*/}}
{{- $trusted := list ".config" ".gitconfig" ".git-credentials" ".ssh" ".gnupg" ".bashrc" ".bash_profile" ".profile" ".zshrc" ".zshenv" ".npmrc" ".netrc" ".claude.json" ".claude/settings.json" ".claude/settings.local.json" ".claude/CLAUDE.md" ".claude/hooks" ".claude/commands" ".claude/agents" ".claude/skills" ".claude/plugins" -}}
{{- range $path := .paths -}}
{{- range $part := splitList "/" $path -}}
{{- if or (eq $part ".") (eq $part "..") -}}
{{- fail (printf "%s: persistence.jobHome.paths has %s; a path is relative to HOME and has no . or .. part" $name $path) -}}
{{- end -}}
{{- end -}}
{{- range $config := $trusted -}}
{{- if or (eq $path $config) (hasPrefix (printf "%s/" $path) $config) (hasPrefix (printf "%s/" $config) $path) -}}
{{- fail (printf "%s: persistence.jobHome.paths has %s, which would keep %s between runs. Tools read it as config or instructions, so an earlier run could plant them for every later one. Persist only data directories, such as .claude/projects or .local/share/sageox" $name $path $config) -}}
{{- end -}}
{{- end -}}
{{- range $other := $agent.persistence.jobHome.paths -}}
{{- if and (ne $path $other) (hasPrefix (printf "%s/" $path) $other) -}}
{{- fail (printf "%s: persistence.jobHome.paths has %s inside %s; list only one of them" $name $other $path) -}}
{{- end -}}
{{- end -}}
{{- $mount := printf "/home/agent/%s" $path -}}
{{- range $volume := $agent.sharedVolumes -}}
{{- $shared := $volume.mountPath | trimSuffix "/" -}}
{{- if or (eq $shared $mount) (hasPrefix (printf "%s/" $shared) $mount) (hasPrefix (printf "%s/" $mount) $shared) -}}
{{- fail (printf "%s: sharedVolumes[%s] mounts at %s, which overlaps the job home's %s" $name $volume.name $volume.mountPath $mount) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $volume := $agent.sharedVolumes -}}
{{- if eq $volume.name "job-home" -}}
{{- fail (printf "%s: sharedVolumes has a volume named job-home, the name the chart gives the job home; rename it" $name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (not $agent.bundle.volume) (not $agent.bundle.stageImage) -}}
{{- fail (printf "%s: bundle needs a volume or a stageImage — one of them has to put the bundle at /config" $name) -}}
{{- end -}}
{{/*
Only a ConfigMap source can carry a key-to-path mapping the consumer wrote by hand, so this
is where an escaping or credential-shaped path can still be spelled. Every other source
carries its own layout, which Kubernetes builds and no value here can redirect.

Absolute as well as `..`-escaping, because the API server refuses both and would refuse
them here — at `helm upgrade`, on a Pod spec whose other objects have already applied.
*/}}
{{- range $item := (($agent.bundle.volume).configMap).items -}}
{{- if or (hasPrefix "/" $item.path) (regexMatch `(^|/)\.\.(/|$)` $item.path) -}}
{{- fail (printf "%s: bundle item path must stay inside the bundle: %s" $name $item.path) -}}
{{- end -}}
{{- if or (hasPrefix "secrets/" $item.path) (regexMatch `(^|/)\.env($|[./])` $item.path) -}}
{{- fail (printf "%s: refusing credential path in bundle ConfigMap: %s" $name $item.path) -}}
{{- end -}}
{{- end -}}
{{- range $field := list "secrets" "jobSecrets" -}}
{{- $source := get $agent $field -}}
{{- if kindIs "map" $source -}}
{{- if and $source.kubernetesSecret $source.csi.secretProviderClass -}}
{{- fail (printf "%s: %s: choose only one source" $name $field) -}}
{{- end -}}
{{- if and $source.csi.provider (not $source.csi.secretProviderClass) -}}
{{- fail (printf "%s: %s: a CSI provider requires secretProviderClass" $name $field) -}}
{{- end -}}
{{- if and (not $source.csi.provider) $source.csi.parameters -}}
{{- fail (printf "%s: %s: CSI parameters require a provider" $name $field) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{/*
`jobSecrets` is mounted by the CronJob Pods this chart renders and by nothing else, so an
agent with no schedule mounts it nowhere. Refused rather than rendered: the whole point of
the field is to move a credential off the Pod that runs the brain, and one set on an agent
whose only Pod is the Deployment has moved nothing while reading as though it had.

A schedule and not a job, because a schedule is what renders the Pod. A run started on
request executes inside the gateway's own process, in the Deployment Pod, with no second
directory to search, so a ref that lives only here cannot resolve there — which is why the
count is of schedules and not of jobs.

Which refs live only here is settled in the bundle: a job naming one in `run.jobSecrets` may
not arm `trigger.onRequest`, and `loadManifest` refuses the pair. Not checkable here — an
agent's values carry a job's slug, schedules and budget, and nothing about its credentials.
*/}}
{{- if kindIs "map" $agent.jobSecrets -}}
{{- $scheduled := 0 -}}
{{- range $job := $agent.jobs -}}
{{- $scheduled = add $scheduled (len $job.trigger.schedules) -}}
{{- end -}}
{{- if eq $scheduled 0 -}}
{{- fail (printf "%s: jobSecrets is mounted by scheduled job Pods only, and this agent declares no schedule" $name) -}}
{{- end -}}
{{- end -}}
{{/*
A work phase is only a boundary if nothing the `job` container holds reaches it. A Pod's
cluster token mounts into every container, and a job home is the `job` container's
persistent HOME, which a harness could seed for a later credentialed run — so a job with
`work: true` refuses both rather than rendering a split that leaks across it. A worker's
Pod is the dispatcher's, and a prompt job has no process.
*/}}
{{- range $job := $agent.jobs -}}
{{- if $job.work -}}
{{- if or $job.worker (hasKey $job "prompt") -}}
{{- fail (printf "%s: job %s has work: true, which only a scheduled local command job can have" $name $job.slug) -}}
{{- end -}}
{{- if $agent.serviceAccount.automountJobToken -}}
{{- fail (printf "%s: job %s has work: true and serviceAccount.automountJobToken is set; the token would mount into the work container too" $name $job.slug) -}}
{{- end -}}
{{- if and ($agent.persistence).jobHome (has $job.slug ($agent.persistence.jobHome.jobs | default list)) -}}
{{- fail (printf "%s: job %s has work: true and is in persistence.jobHome.jobs; a home the publish phase keeps is one an earlier work phase could not reach, and this chart does not yet give the work phase one" $name $job.slug) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (not $agent.serviceAccount.create) (not $agent.serviceAccount.name) -}}
{{- fail (printf "%s: serviceAccount.name is required when create is false" $name) -}}
{{- end -}}
{{- end -}}
{{/*
Two objects of one kind cannot answer to one name. What that renders is two Deployments, two
CronJobs, two ServiceAccounts, or two SecretProviderClasses of one name in one namespace,
which is not two objects at all: on install the second is rejected, and on upgrade it patches
the first, so one agent takes over the other's workload, state, schedule, or identity. Refuse
at render, where both names are still in view — and name both sides, because the object that
survives says nothing about the one that did not.

Of one *kind*, so a registry per kind and not one between them. An agent's Deployment, claim
and ServiceAccount already share a name deliberately, which is the chart saying a name is
qualified by its kind; between agents it has to mean the same thing, or a legal release would
be refused on a resemblance Kubernetes does not care about.

Four ways into a real collision, and they need one check each:

  - `fullnameOverride`, equal to another override or to another agent's default. Agent
    names are unique for free, being map keys, and while every object name was built from
    one that was the whole guarantee. This is the first value that can spend it.
  - A hyphen that two agents read differently. A job's object is `<agent>-<slug>`, so
    `foo` with `bar-baz` and `foo-bar` with `baz` are one CronJob, and no override is
    needed to get there.
  - `serviceAccount.name`, and `secrets.csi.secretProviderClass`. These are the two names a
    consumer supplies outright for an object this chart creates, so neither was ever built
    from the map key that made agents unique. Both name the agent's identity rather than its
    workload, and both fail quiet: the surviving definition is what every Pod naming it
    mounts, so the agent whose definition lost assumes the other's cloud role, or reads the
    other's credentials, instead of failing to start.

Creation is what collides, not the name. An agent that sets `create: false`, or that names a
`secretProviderClass` without a `provider`, is referencing an object this chart does not
render — which is how several agents legitimately share one operator-owned ServiceAccount or
SecretProviderClass, and renders a single object rather than two.
*/}}
{{- $agentNames := dict -}}
{{- $jobNames := dict -}}
{{- $serviceAccountNames := dict -}}
{{- $secretClassNames := dict -}}
{{/* Workers must not share gateway/dispatcher identities or protected Secrets. */}}
{{- $gatewayAccounts := dict -}}
{{- $dispatcherAccounts := dict -}}
{{- $protectedSecrets := dict -}}
{{- range $name, $agent := .Values.agents -}}
{{- $context := dict "root" $ "name" $name "agent" $agent -}}
{{- $_ := set $gatewayAccounts (include "agent.serviceAccountName" $context) $name -}}
{{- range $field := list "secrets" "jobSecrets" -}}
{{- $source := get $agent $field -}}
{{- if and (kindIs "map" $source) $source.kubernetesSecret -}}{{- $_ := set $protectedSecrets $source.kubernetesSecret $name -}}{{- end -}}
{{- end -}}
{{- if $agent.dispatcher -}}
{{- $_ := set $dispatcherAccounts (include "agent.dispatcherName" $context) $name -}}
{{- $_ := set $protectedSecrets $agent.dispatcher.tokenSecret $name -}}
{{- end -}}
{{- end -}}
{{- range $account, $name := $dispatcherAccounts -}}
{{- if hasKey $gatewayAccounts $account -}}
{{- fail (printf "%s: gateway must not use the dispatcher ServiceAccount %s" (get $gatewayAccounts $account) $account) -}}
{{- end -}}
{{- end -}}
{{- range $name, $agent := .Values.agents -}}
{{- $context := dict "root" $ "name" $name "agent" $agent -}}
{{- range $job := $agent.jobs -}}
{{- if $job.worker -}}
{{- if not $agent.dispatcher -}}
{{- fail (printf "%s/%s: external worker requires dispatcher.tokenSecret" $name $job.slug) -}}
{{- end -}}
{{- /* `-0` is load-bearing: a managed distribution reports its GitVersion with a
     build suffix (EKS v1.34.9-eks-bca9cf6, GKE v1.34.5-gke.1234), semver reads that
     as a PRERELEASE, and a constraint carrying none never matches one. Without it
     this floor refuses every managed cluster, including ones far above it. */}}
{{- if not (semverCompare ">=1.34.0-0" $.Capabilities.KubeVersion.Version) -}}
{{- fail (printf "%s/%s: external worker requires Kubernetes 1.34 or newer" $name $job.slug) -}}
{{- end -}}
{{- if hasKey $gatewayAccounts $job.worker.serviceAccountName -}}
{{- fail (printf "%s/%s: worker must use a separate ServiceAccount from the gateway" $name $job.slug) -}}
{{- end -}}
{{- if hasKey $dispatcherAccounts $job.worker.serviceAccountName -}}
{{- fail (printf "%s/%s: worker must not use the dispatcher ServiceAccount" $name $job.slug) -}}
{{- end -}}
{{- range $ref, $secret := $job.worker.secrets -}}
{{- if hasKey $protectedSecrets $secret.name -}}
{{- fail (printf "%s/%s: worker secret %s (%s) must be separate from gateway, dispatcher, and scheduled-job secrets" $name $job.slug $ref $secret.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- $full := include "agent.agentFullname" $context -}}
{{- if hasKey $agentNames $full -}}
{{- fail (printf "%s and %s would both render objects named %s: every agent of a release must resolve to its own name" (get $agentNames $full) $name $full) -}}
{{- end -}}
{{- $_ := set $agentNames $full $name -}}
{{- if $agent.dispatcher -}}
{{- $dispatcher := include "agent.dispatcherName" $context -}}
{{- if hasKey $agentNames $dispatcher -}}
{{- fail (printf "%s: dispatcher name %s collides with another agent" $name $dispatcher) -}}
{{- end -}}
{{- $_ := set $agentNames $dispatcher $name -}}
{{- end -}}
{{- if $agent.serviceAccount.create -}}
{{- $account := include "agent.serviceAccountName" $context -}}
{{- if hasKey $serviceAccountNames $account -}}
{{- fail (printf "%s and %s would both create a ServiceAccount named %s: an object this chart creates belongs to one agent — to share one, set serviceAccount.create to false on every agent but its owner" (get $serviceAccountNames $account) $name $account) -}}
{{- end -}}
{{- $_ := set $serviceAccountNames $account $name -}}
{{- end -}}
{{- range $field := list "secrets" "jobSecrets" -}}
{{- $source := get $agent $field -}}
{{- if and (kindIs "map" $source) $source.csi.provider -}}
{{- $class := $source.csi.secretProviderClass -}}
{{- if hasKey $secretClassNames $class -}}
{{- fail (printf "%s and %s/%s would both create a SecretProviderClass named %s: an object this chart creates belongs to one agent, and to one of its two secret sources — to share one, leave csi.provider unset everywhere but its owner" (get $secretClassNames $class) $name $field $class) -}}
{{- end -}}
{{- $_ := set $secretClassNames $class (printf "%s/%s" $name $field) -}}
{{- end -}}
{{- end -}}
{{- range $job := $agent.jobs -}}
{{- $schedules := $job.trigger.schedules -}}
{{- range $index, $schedule := $schedules -}}
{{- $scheduled := include "agent.jobFullname" (merge (dict "job" $job "index" $index "total" (len $schedules)) $context) -}}
{{- if hasKey $jobNames $scheduled -}}
{{- fail (printf "%s and %s/%s would both render a CronJob named %s: every scheduled job of a release must resolve to its own name" (get $jobNames $scheduled) $name $job.slug $scheduled) -}}
{{- end -}}
{{- $_ := set $jobNames $scheduled (printf "%s/%s" $name $job.slug) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{/*
A job home's claim is `<agent claim>-home`, which can be another agent's own claim name: agents
`foo` and `foo-home` would both render `<release>-foo-home`. Two claims of one name cannot both
install, and a job could mount the other agent's state as its home. Checked across agents.
*/}}
{{- $claims := dict -}}
{{- range $name, $agent := .Values.agents -}}
{{- $context := dict "root" $ "name" $name "agent" $agent -}}
{{- if $agent.persistence.existingClaim -}}
{{- $_ := set $claims $agent.persistence.existingClaim (printf "a claim %s mounts" $name) -}}
{{- else -}}
{{- $_ := set $claims (include "agent.claimName" $context) (printf "%s's claim" $name) -}}
{{- end -}}
{{- range $volume := $agent.sharedVolumes -}}
{{- $_ := set $claims $volume.claimName (printf "the claim of %s's shared volume %s" $name $volume.name) -}}
{{- end -}}
{{- end -}}
{{- range $name, $agent := .Values.agents -}}
{{- if ($agent.persistence).jobHome -}}
{{- $context := dict "root" $ "name" $name "agent" $agent -}}
{{- $claim := include "agent.jobHomeClaimName" $context -}}
{{- if hasKey $claims $claim -}}
{{- fail (printf "%s: its job home claim %s is also %s; change that claim reference, rename an agent or set its fullnameOverride" $name $claim (get $claims $claim)) -}}
{{- end -}}
{{- $_ := set $claims $claim (printf "%s's job home claim" $name) -}}
{{- end -}}
{{- end -}}
