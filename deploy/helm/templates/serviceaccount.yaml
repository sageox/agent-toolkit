{{- range $name, $agent := .Values.agents }}
{{- if $agent.serviceAccount.create }}
{{- $context := dict "root" $ "name" $name "agent" $agent -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent.serviceAccountName" $context }}
  namespace: {{ $.Release.Namespace }}
  {{- with $agent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "agent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | quote }}
# Stays false however `serviceAccount.automountJobToken` is set: a Pod spec that states
# this field wins over the ServiceAccount's, so the knob reaches the CronJob Pods that set
# it to true and nothing else that names this identity.
automountServiceAccountToken: false
{{ end }}
{{ end }}
